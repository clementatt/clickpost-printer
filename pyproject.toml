[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dzpost"
version = "0.1.0"
description = "Print Japan Post ClickPost labels on a DeTong DP-series label printer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dz-post-label contributors" }]
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10",
]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
usb = ["pyusb>=1.2"]

[project.scripts]
dzpost = "dzpost.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dzpost = ["py.typed"]
